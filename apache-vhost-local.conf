# =============================================================================
# GatewayPro - VirtualHost para rodar o projeto em DESENVOLVIMENTO (XAMPP)
# =============================================================================
#
# COMO INSTALAR NO XAMPP:
#   1. Abra  C:\xampp\apache\conf\extra\httpd-vhosts.conf
#   2. Apague tudo que estiver la e cole o conteudo deste arquivo inteiro
#   3. Abra  C:\xampp\apache\conf\httpd.conf  e procure a linha
#        Include conf/extra/httpd-vhosts.conf
#      Se estiver comentada (#Include), remova o # para ativar
#   4. Reinicie o Apache pelo painel do XAMPP
#   5. Acesse http://localhost:81
#
# POR QUE PRECISA DISSO:
#   - O Apache so le .htaccess de pastas dentro de um bloco <Directory>.
#     O projeto esta em F:\checkout, que esta FORA do htdocs padrao,
#     entao precisamos deste vhost para o Apache "enxergar" a pasta.
#   - O projeto usa URLs SEM extensao (/login, /admin, /curso_preview).
#     As regras Rewrite abaixo traduzem isso para os arquivos .php.
#     Sem elas, o login da erro 404.
#
# =============================================================================

<VirtualHost *:81>
    ServerName localhost
    DocumentRoot "F:/checkout"

    <Directory "F:/checkout">
        # All = obrigatorio, senao os .htaccess de seguranca sao IGNORADOS
        # silenciosamente e o site inteiro fica sem protecao.
        AllowOverride All

        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Libera a passagem de diretorios (imagens de produto, logo, etc.)
    Alias /uploads/ "F:/checkout/uploads/"

    <Directory "F:/checkout/uploads">
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # URLs sem extensao -> arquivos .php
    # ------------------------------------------------------------------
    RewriteEngine On

    # /login, /admin, /index, /member_area_dashboard ... -> arquivo na RAIZ
    # Ex: http://localhost:81/login  ->  F:\checkout\login.php
    RewriteCond %{DOCUMENT_ROOT}/$1.php -f
    RewriteRule ^([A-Za-z0-9_-]+)/?$ $1.php [L]

    # Se nao existe na raiz, tenta dentro de views/
    # Ex: http://localhost:81/curso_preview -> F:\checkout\views\curso_preview.php
    # Ex: http://localhost:81/cloned_site_viewer -> F:\checkout\views\cloned_site_viewer.php
    RewriteCond %{DOCUMENT_ROOT}/views/$1.php -f
    RewriteRule ^([A-Za-z0-9_-]+)/?$ views/$1.php [L]

    ErrorLog "logs/gatewaypro-error.log"
    CustomLog "logs/gatewaypro-access.log" combined
</VirtualHost>
