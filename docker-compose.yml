# GatewayPro - stack de instalacao (Docker Swarm / Portainer)
#
# COMO USAR (cliente):
#   1. Copie este arquivo inteiro para o Portainer > Stacks > Add stack
#   2. Troque cada occurrence de TROCAR_ pelo valor real (estao em maiusculas)
#   3. Clique em Deploy. O banco e criado vazio e as 30 tabelas entram sozinhas.
#
# O que o cliente PRECISA trocar: dominio, senha do banco, nome do banco,
# rede do Traefik, nome do certresolver, token da API e o segredo de e-mail.
# O resto ja funciona sem edicao.

services:

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MARIADB_ROOT_PASSWORD: "TROCAR_SENHA_ROOT_FORTE"
      MARIADB_DATABASE: "TROCAR_NOME_DO_BANCO"
      MARIADB_USER: "gatewaypro"
      MARIADB_PASSWORD: "TROCAR_SENHA_DO_APP"
      # A API interna (api.php) le este valor do ambiente. Sem ele o
      # middleware cai no banco, onde a chave nao existe, e usa o padrao
      # 'SUA_CHAVE_SECRETA' - a API ficaria autenticando com uma chave
      # que todo mundo conhece.
      TOKEN_AUTH_SECRET: "TROCAR_SEGREDO_DA_API"
    volumes:
      - db_data:/var/lib/mysql
      # cria as 30 tabelas no primeiro start
      - ./Banco_de_Dados.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      # so a rede interna. O banco nao entra na rede do Traefik de proposito:
      # se entrasse, qualquer servico da rede conseguiria abrir a porta 3306.
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatewaypro-app:latest
    restart: unless-stopped
    # Em Swarm a forma longa de depends_on (condition:) nao e aceita
    # ("must be a list") e o proprio entrypoint ja espera o banco ficar
    # saudavel antes de montar o config.
    depends_on:
      - db
    environment:
      # lidos pelo entrypoint para montar o config/config.php
      TZ: America/Sao_Paulo
      DB_HOST: "db:3306"
      DB_NAME: "TROCAR_NOME_DO_BANCO"
      DB_USER: "gatewaypro"
      DB_PASSWORD: "TROCAR_SENHA_DO_APP"
      TOKEN_AUTH_SECRET: "TROCAR_SEGREDO_DA_API"
      # true = nao pede chave de ativacao. Deixe assim.
      LICENCA_DESATIVADA: "true"
      # string longa e aleatoria, usada para assinar o link de descadastro
      # de e-mail. Nao deixe o valor de exemplo.
      MAIL_UNSUBSCRIBE_SECRET: "TROCAR_SEGREDO_LONGO_ALEATORIO"
    volumes:
      # Guarda os arquivos enviados pelo cliente.
      # Backup deste volume = backup de tudo que o usuario subiu.
      - app_uploads:/var/www/html/uploads
    networks:
      - internal
      - traefik
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
      labels:
        # ---------- rota do app ----------
        - "traefik.enable=true"
        - "traefik.docker.network=TROCAR_NOME_DA_REDE_EXTERNA"
        - "traefik.http.routers.gatewaypro.rule=Host(`TROCAR_SEU_DOMINIO`)"
        - "traefik.http.routers.gatewaypro.entrypoints=websecure"
        - "traefik.http.routers.gatewaypro.tls=true"
        - "traefik.http.routers.gatewaypro.tls.certresolver=TROCAR_NOME_DO_CERTIFICADOR"
        - "traefik.http.services.gatewaypro.loadbalancer.server.port=80"

volumes:
  db_data:
  app_uploads:

networks:
  # RedeOverlay para o app falar com o banco sem passar pela rede do Traefik
  internal:
    driver: overlay
    attachable: true
  # rede ja existente do Traefik do cliente
  traefik:
    external: true
    # nome real da rede externa do Traefik (docker network ls)
    name: "TROCAR_NOME_DA_REDE_EXTERNA"
