# GatewayPro - stack de instalacao (Docker Swarm / Portainer)
#
# COMO USAR (cliente):
#   1. Copie este arquivo inteiro para o Portainer > Stacks > Add stack
#   2. Troque cada occurrence de TROCAR_ pelo valor real (estao em maiusculas)
#   3. Clique em Deploy. O banco e criado vazio e as 30 tabelas entram sozinhas.
#
# O que o cliente PRECISA trocar: dominio, senha do banco, nome do banco,
# rede externa e a senha do Portainer. O resto ja funciona sem edicao.

services:

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "TROCAR_SENHA_ROOT_FORTE"
      MARIADB_DATABASE: "TROCAR_NOME_DO_BANCO"
      MARIADB_USER: "gatewaypro"
      MARIADB_PASSWORD: "TROCAR_SENHA_DO_APP"
    volumes:
      - db_data:/var/lib/mysql
      # cria as 30 tabelas no primeiro start
      - ./Banco_de_Dados.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - gatewaypro_net
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatewaypro-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # lidos pelo entrypoint para montar o config/config.php
      DB_HOST: "db:3306"
      DB_NAME: "TROCAR_NOME_DO_BANCO"
      DB_USER: "gatewaypro"
      DB_PASSWORD: "TROCAR_SENHA_DO_APP"
      # true = nao pede chave de ativacao. Deixe assim.
      LICENCA_DESATIVADA: "true"
      # string longa e aleatoria, usada para assinar o link de descadastro
      # de e-mail. Nao deixe o valor de exemplo.
      MAIL_UNSUBSCRIBE_SECRET: "TROCAR_SEGREDO_LONGO_ALEATORIO"
    volumes:
      # Guarda os arquivos enviados pelo cliente.
      # Backup deste volume = backup de tudo que o usuario subiu.
      - app_uploads:/var/www/html/uploads
    networks:
      - gatewaypro_net
    deploy:
      resources:
        limits:
          memory: 512M
      labels:
        # ---------- rota do app ----------
        - "traefik.enable=true"
        - "traefik.docker.network=gatewaypro_net"
        - "traefik.http.routers.gatewaypro.rule=Host(`TROCAR_SEU_DOMINIO`)"
        - "traefik.http.routers.gatewaypro.entrypoints=web,websecure"
        - "traefik.http.routers.gatewaypro.tls.certresolver=letsencrypt"
        - "traefik.http.services.gatewaypro.loadbalancer.server.port=80"

        # ---------- rota do Portainer em /manage ----------
        # Opcional. Apague estas 6 linhas se o cliente nao quiser o Portainer
        # no mesmo dominio. Prioridade alta para o app nao engolir /manage.
        - "traefik.http.routers.gatewaypro-manage.rule=Host(`TROCAR_SEU_DOMINIO`) && PathPrefix(`/manage`)"
        - "traefik.http.routers.gatewaypro-manage.entrypoints=web,websecure"
        - "traefik.http.routers.gatewaypro-manage.tls.certresolver=letsencrypt"
        - "traefik.http.routers.gatewaypro-manage.priority=100"
        - "traefik.http.routers.gatewaypro-manage.middlewares=gatewaypro-manage-auth"
        - "traefik.http.middlewares.gatewaypro-manage-auth.basicauth.users=PORTAINER_USUARIO:PORTAINER_SENHA_BCRYPT"
        - "traefik.http.middlewares.gatewaypro-manage-auth.service.name=portainer@docker-swarm"

volumes:
  db_data:
  app_uploads:

networks:
  gatewaypro_net:
    external: true
    # rede ja existente do Traefik do cliente (veja com: docker network ls)
    name: "TROCAR_NOME_DA_REDE_EXTERNA"
